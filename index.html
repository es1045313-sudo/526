<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的個人網站</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Noto Sans TC", sans-serif;
      background: #f5f7fa;
      color: #333;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .profile-img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 6px solid #4f46e5;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: #111827;
    }

    p {
      color: #6b7280;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-primary {
      background: #4f46e5;
      color: white;
    }

    .btn-primary:hover {
      background: #4338ca;
    }

    .btn-outline {
      border: 2px solid #4f46e5;
      color: #4f46e5;
      background: white;
    }

    .btn-outline:hover {
      background: #eef2ff;
    }

    footer {
      margin-top: 30px;
      font-size: 0.9rem;
      color: #9ca3af;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">

      <!-- 個人照片 -->
      <img src="me.jpg" alt="我的照片" class="profile-img" />

      <!-- 個人資訊 -->
      <h1>你的名字</h1>
      <p>
        嗨，我是一位網頁設計 / 程式開發 / 創作者。<br>
        歡迎來到我的個人網站。
      </p>

      <!-- 按鈕 -->
      <div class="buttons">
        <a href="work.pdf" target="_blank" class="btn btn-primary">
          查看我的作品集
        </a>

        <a href="mailto:you@example.com" class="btn btn-outline">
          聯絡我
        </a>
      </div>

      <footer>
        © 2026 Your Name
      </footer>

    </div>
  </div>
</body>
</html>
